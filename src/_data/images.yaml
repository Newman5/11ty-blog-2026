# Image Asset Registry
#
# This file defines reusable images across the blog.
# Registry metadata provides the default alt text, caption/description,
# source, and credit. Shortcode arguments can override those defaults for a
# specific use:
#
#   {% imageAsset "mountains" %}
#   {% imageAsset "mountains", "Context-specific alt text" %}
#   {% imageAsset "mountains", "Context-specific alt text", { caption: false } %}
#
# Provider-specific behavior belongs in the image provider adapter. Templates
# should use registry keys and should not need to know which provider supplies
# the image.
#
# FIELDS PER ENTRY
#   key         - short descriptive name used as the filename prefix
#   provider    - image source provider; currently "unsplash" or "local"
#   provider_id - provider-specific ID; for Unsplash, the photo ID from the URL
#   src         - local/public image path for provider: local
#   alt         - default accessible description for the <img alt> attribute
#   description - default caption or longer context
#   credit      - creator name, username, and/or URL
#   source      - source name and URL

images:
